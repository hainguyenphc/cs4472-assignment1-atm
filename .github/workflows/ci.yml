name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [dev]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Checkstyle
        run: mvn -B checkstyle:check

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Determine phase from PR labels
        id: phase
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "Push to dev: running suite in informational mode."
            echo "mode=informational" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          has_tests=$(echo "$LABELS" | jq 'index("phase:tests") != null')
          has_fix=$(echo "$LABELS" | jq 'index("phase:fix") != null')

          if [ "$has_tests" = "true" ] && [ "$has_fix" = "false" ]; then
            echo "mode=tests" >> "$GITHUB_OUTPUT"
          elif [ "$has_fix" = "true" ] && [ "$has_tests" = "false" ]; then
            echo "mode=fix" >> "$GITHUB_OUTPUT"
          else
            echo "::error::PR must carry exactly one of the labels 'phase:tests' or 'phase:fix' (found: $LABELS)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Run tests (failures tolerated)
        if: steps.phase.outputs.mode != 'fix'
        run: mvn -B -Dmaven.test.failure.ignore=true test

      - name: Run tests (entire suite must pass)
        if: steps.phase.outputs.mode == 'fix'
        run: mvn -B test

      - name: Publish JUnit results
        if: always() && steps.phase.outcome == 'success'
        continue-on-error: true
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: target/surefire-reports/*.xml
          check_name: JUnit test report
          comment_mode: always
          fail_on: nothing

      - name: Publish JaCoCo coverage
        if: always() && github.event_name == 'pull_request' && steps.phase.outcome == 'success'
        continue-on-error: true
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Coverage report
          update-comment: true
