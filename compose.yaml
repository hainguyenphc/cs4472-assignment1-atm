services:
  atm:
    build: .
    image: cs4472-atm-dev
    working_dir: /workspace
    volumes:
      # Your checkout, live: edit on the host, run inside the container.
      - .:/workspace
      # Maven download cache, kept between runs.
      - m2:/root/.m2
    stdin_open: true
    tty: true

volumes:
  m2:
